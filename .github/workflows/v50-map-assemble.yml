name: Assemble V50 World Map

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/v50-map-assemble.yml"
      - "tools/v50_map_payload/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v50-map-assemble
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble V50 WebP
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/v50_map_payload/14.txt
          mkdir -p assets/map
          cat tools/v50_map_payload/*.txt | tr -d '\n\r' | base64 -d > assets/map/desert_world_v50.webp
          echo "size=$(stat -c%s assets/map/desert_world_v50.webp)"
          echo "sha256=$(sha256sum assets/map/desert_world_v50.webp | awk '{print $1}')"
          test "$(stat -c%s assets/map/desert_world_v50.webp)" = "108490"
          test "$(sha256sum assets/map/desert_world_v50.webp | awk '{print $1}')" = "c2d83a5aa0ecf7923bcbba1f38bae8ad5bbc9032ba8a3fdcdd5ebae49ec9b923"

      - name: Commit assembled map
        shell: bash
        run: |
          set -euo pipefail
          git add assets/map/desert_world_v50.webp
          if git diff --cached --quiet; then
            echo "V50 map already assembled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "V50: assemble production world map"
          git push
