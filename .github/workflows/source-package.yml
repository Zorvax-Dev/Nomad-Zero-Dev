name: Source Package

on:
  workflow_run:
    workflows: ["Godot CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-package
  cancel-in-progress: true

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Package source project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package/NOMAD_ZERO_DEV
          rsync -a --exclude='.git' --exclude='package' ./ package/NOMAD_ZERO_DEV/
          cd package
          zip -qr ../nomad-zero-dev-source.zip NOMAD_ZERO_DEV

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomad-zero-dev-source-${{ github.sha }}
          path: nomad-zero-dev-source.zip
          retention-days: 2
          if-no-files-found: error
