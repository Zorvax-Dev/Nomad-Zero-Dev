name: Godot CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "index*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nomad-zero-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_RELEASE: "4.7.2-stable"
  GODOT_BIN: "Godot_v4.7.2-stable_linux.x86_64"
  GODOT_TEMPLATE_DIR: "4.7.2.stable"

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip curl python3

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"
          curl -L --fail --retry 3             "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"             -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/${GODOT_BIN}"
          "$HOME/godot/${GODOT_BIN}" --version

      - name: Install export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"             -o /tmp/godot-templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/"

      - name: Static validation
        run: |
          python3 tools/release_check.py
          python3 tools/validate_project.py

      - name: Godot headless import
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/godot/${GODOT_BIN}" --headless --editor --path "$GITHUB_WORKSPACE" --quit-after 3

      - name: Export Web PWA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/web
          mkdir -p build/web
          "$HOME/godot/${GODOT_BIN}"             --headless             --path "$GITHUB_WORKSPACE"             --export-release "Web PWA"             "$GITHUB_WORKSPACE/build/web/index.html"

      - name: Smoke test Web PWA
        run: python3 tools/smoke_check_web.py build/web

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomad-zero-web-${{ github.sha }}
          path: build/web
          retention-days: 14
          if-no-files-found: error

      - name: Refresh committed Web/PWA build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/main | cut -f1)"
          LOCAL_HEAD="$(git rev-parse HEAD)"
          if [ "$REMOTE_HEAD" != "$LOCAL_HEAD" ]; then
            echo "A newer source commit exists; its workflow will publish the matching build."
            exit 0
          fi
          cp -f build/web/* .
          git add -- index*
          if git diff --cached --quiet; then
            echo "Web build already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(web): refresh V$(cat VERSION.txt) [skip ci]"
          git push
