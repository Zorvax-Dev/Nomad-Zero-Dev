name: Godot CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"
  GODOT_BIN: "Godot_v4.7.2-stable_linux.x86_64"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip curl python3

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/${GODOT_BIN}"
          "$HOME/godot/${GODOT_BIN}" --version

      - name: Static validation
        run: |
          python3 tools/release_check.py
          python3 tools/validate_project.py

      - name: Godot headless import
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/godot/${GODOT_BIN}" --headless --editor --path "$GITHUB_WORKSPACE" --quit-after 3
