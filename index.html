<script>
  (function () {
    function showLoaderProgress() {
      const status = document.getElementById('status');
      const progress = document.getElementById('status-progress');
      if (!status || !progress) return;
      const horizon = document.createElement('div');
      horizon.id = 'nomad-loader-horizon';
      status.appendChild(horizon);
      const marker = document.createElement('div');
      marker.id = 'nomad-loader-marker';
      marker.textContent = 'V49.6 // MONDE & COLLISIONS';
      status.appendChild(marker);
      const caption = document.createElement('div');
      caption.id = 'nomad-loader-caption';
      const phase = document.createElement('span');
      const percent = document.createElement('span');
      phase.textContent = 'PRÉPARATION DU SECTEUR';
      caption.append(phase, percent);
      status.appendChild(caption);
      const timer = window.setInterval(function () {
        if (!status.isConnected) { window.clearInterval(timer); return; }
        if (document.getElementById('status-notice')?.style.display === 'block') {
          phase.textContent = 'CHARGEMENT INTERROMPU';
          percent.textContent = '';
          return;
        }
        if (progress.style.display === 'none') {
          phase.textContent = 'INITIALISATION';
          percent.textContent = '';
          return;
        }
        const total = Number(progress.max);
        const current = Number(progress.value);
        if (total > 0 && Number.isFinite(current)) {
          const value = Math.max(0, Math.min(100, Math.round(current / total * 100)));
          percent.textContent = value + ' %';
          phase.textContent = value >= 100 ? 'OUVERTURE DE LA ZONE' : 'CHARGEMENT DES DONNÉES';
        } else {
          phase.textContent = 'PRÉPARATION DU SECTEUR';
          percent.textContent = '';
        }
      }, 120);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', showLoaderProgress, { once: true });
    } else {
      showLoaderProgress();
    }
  })();
</script>

	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');

		setStatusMode('notice');
		initializing = false;

					}
					return registration;

				// For some reason, `getRegistration()` can stall

		} else {
