<style>
  body { background: #0b1620; }
  #status {
    visibility: visible;
    overflow: hidden;
    isolation: isolate;
    background:
      repeating-linear-gradient(135deg, transparent 0 34px, rgba(144, 218, 222, .022) 35px, transparent 36px 71px),
      radial-gradient(ellipse 37% 54% at 50% 47%, rgba(33, 120, 139, .23), transparent 70%),
      radial-gradient(ellipse 48% 46% at 22% 115%, rgba(202, 106, 47, .25), transparent 76%),
      radial-gradient(circle at 50% 47%, transparent 0 106px, rgba(102, 219, 229, .14) 107px 108px, transparent 109px 145px, rgba(200, 156, 91, .09) 146px 147px, transparent 148px),
      linear-gradient(155deg, #0b1620 4%, #101c26 49%, #241b19 100%);
    font-family: system-ui, -apple-system, sans-serif;
  }
  #nomad-loader-horizon {
    position: absolute;
    inset: auto 0 0;
    height: 43%;
    opacity: .72;
    pointer-events: none;
    background: linear-gradient(to top, rgba(44, 25, 23, .88), rgba(122, 68, 41, .28) 50%, transparent 100%);
    clip-path: polygon(0 50%, 12% 58%, 29% 39%, 41% 53%, 56% 45%, 70% 63%, 84% 40%, 100% 57%, 100% 100%, 0 100%);
    animation: nomad-arrival 1.1s ease-out both;
  }
  #nomad-loader-marker {
    position: absolute;
    top: max(18px, env(safe-area-inset-top));
    left: max(28px, env(safe-area-inset-left));
    color: #8ac9d0;
    font: 600 10px ui-monospace, Menlo, monospace;
    letter-spacing: .24em;
    opacity: .8;
    pointer-events: none;
  }
  #status::before {
    content: 'NØMAD ZERO';
    position: absolute;
    top: 36%;
    left: 50%;
    width: 96%;
    transform: translate(-50%, -50%);
    color: #f7dcba;
    font-size: clamp(34px, 7.4vw, 78px);
    font-weight: 850;
    line-height: 1;
    letter-spacing: .13em;
    text-align: center;
    text-shadow: 0 2px 0 #814423, 0 0 32px rgba(232, 133, 63, .34);
    animation: nomad-glow 3.2s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 2;
  }
  #status::after {
    content: "LE RIFT S’OUVRE";
    position: absolute;
    top: 55%;
    left: 50%;
    width: 95%;
    transform: translateX(-50%);
    color: #91d9e1;
    font: 600 clamp(11px, 1.5vw, 15px) ui-monospace, Menlo, monospace;
    letter-spacing: .4em;
    text-align: center;
    pointer-events: none;
    z-index: 2;
  }
  #status-splash { display: none !important; }
  #status-progress {
    z-index: 2;
    top: 70%;
    bottom: auto;
    left: 50%;
    right: auto;
    width: min(64vw, 510px);
    height: 8px;
    margin: 0;
    transform: translateX(-50%);
    appearance: none;
    -webkit-appearance: none;
    overflow: hidden;
    border: 1px solid rgba(104, 216, 227, .47);
    border-radius: 999px;
    background: #142b35;
    box-shadow: 0 0 20px rgba(58, 209, 229, .18);
  }
  #status-progress::-webkit-progress-bar { background: #142b35; }
  #status-progress::-webkit-progress-value {
    background: linear-gradient(90deg, #bc713d, #f4b76d 44%, #6de0ee 100%);
    box-shadow: 0 0 14px #61dbe8;
  }
  #status-progress::-moz-progress-bar {
    background: linear-gradient(90deg, #bc713d, #f4b76d 44%, #6de0ee 100%);
  }
  #nomad-loader-caption {
    z-index: 2;
    position: absolute;
    top: calc(70% + 19px);
    left: 50%;
    display: flex;
    justify-content: space-between;
    width: min(64vw, 510px);
    transform: translateX(-50%);
    color: #b3c8cc;
    font: 600 11px ui-monospace, Menlo, monospace;
    letter-spacing: .15em;
    white-space: nowrap;
    pointer-events: none;
  }
  #nomad-loader-caption span:last-child { color: #8beaf2; }
  #status-notice {
    z-index: 3;
    max-width: min(78vw, 650px);
    background: rgba(28, 32, 38, .97);
    border: 1px solid #e08868;
  }
  @keyframes nomad-glow {
    from { filter: brightness(.87); }
    to { filter: brightness(1.15); }
  }
  @keyframes nomad-arrival {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: .72; transform: translateY(0); }
  }
  @media (max-height: 480px) {
    #status::before { top: 32%; }
    #status::after { top: 52%; }
    #status-progress { top: 69%; }
    #nomad-loader-caption { top: calc(69% + 16px); }
  }
  @media (prefers-reduced-motion: reduce) {
    #status::before, #nomad-loader-horizon { animation: none; }
  }
  /* Visible dès la première image, y compris avant le démarrage de Godot. */
  @media (orientation: portrait) {
    body::before {
      content: "↻\A\A NØMAD ZERO\A\A MODE PAYSAGE\A\A Tourne ton téléphone pour jouer.\A Déverrouille la rotation si besoin.";
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-left));
      color: #f7dcba;
      background: radial-gradient(circle at 50% 43%, #183c46, #0b1620 75%);
      font: 700 clamp(19px, 5vw, 28px)/1.3 system-ui, -apple-system, sans-serif;
      text-align: center;
      white-space: pre-line;
      letter-spacing: .08em;
    }
  }
</style>
<script>
  (function () {
    function showLoaderProgress() {
      const status = document.getElementById('status');
      const progress = document.getElementById('status-progress');
      if (!status || !progress) return;
      const horizon = document.createElement('div');
      horizon.id = 'nomad-loader-horizon';
      status.appendChild(horizon);
      const marker = document.createElement('div');
      marker.id = 'nomad-loader-marker';
      marker.textContent = 'V50.0 // RECONSTRUCTION VISUELLE';
      status.appendChild(marker);
      const caption = document.createElement('div');
      caption.id = 'nomad-loader-caption';
      const phase = document.createElement('span');
      const percent = document.createElement('span');
      phase.textContent = 'PRÉPARATION DU SECTEUR';
      caption.append(phase, percent);
      status.appendChild(caption);
      const timer = window.setInterval(function () {
        if (!status.isConnected) { window.clearInterval(timer); return; }
        if (document.getElementById('status-notice')?.style.display === 'block') {
          phase.textContent = 'CHARGEMENT INTERROMPU';
          percent.textContent = '';
          return;
        }
        if (progress.style.display === 'none') {
          phase.textContent = 'INITIALISATION';
          percent.textContent = '';
          return;
        }
        const total = Number(progress.max);
        const current = Number(progress.value);
        if (total > 0 && Number.isFinite(current)) {
          const value = Math.max(0, Math.min(100, Math.round(current / total * 100)));
          percent.textContent = value + ' %';
          phase.textContent = value >= 100 ? 'OUVERTURE DE LA ZONE' : 'CHARGEMENT DES DONNÉES';
        } else {
          phase.textContent = 'PRÉPARATION DU SECTEUR';
          percent.textContent = '';
        }
      }, 120);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', showLoaderProgress, { once: true });
    } else {
      showLoaderProgress();
    }
  })();
</script>
