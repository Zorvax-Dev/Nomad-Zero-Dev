html/head_include="<script>(function(){var v=document.querySelector('meta[name=viewport]');if(!v){v=document.createElement('meta');v.name='viewport';document.head.appendChild(v);}if(v.content.indexOf('viewport-fit=')<0){v.content=(v.content?v.content+',':'')+'viewport-fit=cover';}})();</script><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\"><meta name=\"apple-mobile-web-app-title\" content=\"NØMAD ZERO\">\n<!-- NOMAD_LOADER_BEGIN -->\n<style>\n  body { background: #0b1620; }\n  #status {\n    visibility: visible;\n    overflow: hidden;\n    isolation: isolate;\n    background:\n      repeating-linear-gradient(135deg, transparent 0 34px, rgba(144, 218, 222, .022) 35px, transparent 36px 71px),\n      radial-gradient(ellipse 37% 54% at 50% 47%, rgba(33, 120, 139, .23), transparent 70%),\n      radial-gradient(ellipse 48% 46% at 22% 115%, rgba(202, 106, 47, .25), transparent 76%),\n      radial-gradient(circle at 50% 47%, transparent 0 106px, rgba(102, 219, 229, .14) 107px 108px, transparent 109px 145px, rgba(200, 156, 91, .09) 146px 147px, transparent 148px),\n      linear-gradient(155deg, #0b1620 4%, #101c26 49%, #241b19 100%);\n    font-family: system-ui, -apple-system, sans-serif;\n  }\n  #nomad-loader-horizon {\n    position: absolute;\n    inset: auto 0 0;\n    height: 43%;\n    opacity: .72;\n    pointer-events: none;\n    background: linear-gradient(to top, rgba(44, 25, 23, .88), rgba(122, 68, 41, .28) 50%, transparent 100%);\n    clip-path: polygon(0 50%, 12% 58%, 29% 39%, 41% 53%, 56% 45%, 70% 63%, 84% 40%, 100% 57%, 100% 100%, 0 100%);\n    animation: nomad-arrival 1.1s ease-out both;\n  }\n  #nomad-loader-marker {\n    position: absolute;\n    top: max(18px, env(safe-area-inset-top));\n    left: max(28px, env(safe-area-inset-left));\n    color: #8ac9d0;\n    font: 600 10px ui-monospace, Menlo, monospace;\n    letter-spacing: .24em;\n    opacity: .8;\n    pointer-events: none;\n  }\n  #status::before {\n    content: 'NØMAD ZERO';\n    position: absolute;\n    top: 36%;\n    left: 50%;\n    width: 96%;\n    transform: translate(-50%, -50%);\n    color: #f7dcba;\n    font-size: clamp(34px, 7.4vw, 78px);\n    font-weight: 850;\n    line-height: 1;\n    letter-spacing: .13em;\n    text-align: center;\n    text-shadow: 0 2px 0 #814423, 0 0 32px rgba(232, 133, 63, .34);\n    animation: nomad-glow 3.2s ease-in-out infinite alternate;\n    pointer-events: none;\n    z-index: 2;\n  }\n  #status::after {\n    content: \"LE RIFT S’OUVRE\";\n    position: absolute;\n    top: 55%;\n    left: 50%;\n    width: 95%;\n    transform: translateX(-50%);\n    color: #91d9e1;\n    font: 600 clamp(11px, 1.5vw, 15px) ui-monospace, Menlo, monospace;\n    letter-spacing: .4em;\n    text-align: center;\n    pointer-events: none;\n    z-index: 2;\n  }\n  #status-splash { display: none !important; }\n  #status-progress {\n    z-index: 2;\n    top: 70%;\n    bottom: auto;\n    left: 50%;\n    right: auto;\n    width: min(64vw, 510px);\n    height: 8px;\n    margin: 0;\n    transform: translateX(-50%);\n    appearance: none;\n    -webkit-appearance: none;\n    overflow: hidden;\n    border: 1px solid rgba(104, 216, 227, .47);\n    border-radius: 999px;\n    background: #142b35;\n    box-shadow: 0 0 20px rgba(58, 209, 229, .18);\n  }\n  #status-progress::-webkit-progress-bar { background: #142b35; }\n  #status-progress::-webkit-progress-value {\n    background: linear-gradient(90deg, #bc713d, #f4b76d 44%, #6de0ee 100%);\n    box-shadow: 0 0 14px #61dbe8;\n  }\n  #status-progress::-moz-progress-bar {\n    background: linear-gradient(90deg, #bc713d, #f4b76d 44%, #6de0ee 100%);\n  }\n  #nomad-loader-caption {\n    z-index: 2;\n    position: absolute;\n    top: calc(70% + 19px);\n    left: 50%;\n    display: flex;\n    justify-content: space-between;\n    width: min(64vw, 510px);\n    transform: translateX(-50%);\n    color: #b3c8cc;\n    font: 600 11px ui-monospace, Menlo, monospace;\n    letter-spacing: .15em;\n    white-space: nowrap;\n    pointer-events: none;\n  }\n  #nomad-loader-caption span:last-child { color: #8beaf2; }\n  #status-notice {\n    z-index: 3;\n    max-width: min(78vw, 650px);\n    background: rgba(28, 32, 38, .97);\n    border: 1px solid #e08868;\n  }\n  @keyframes nomad-glow {\n    from { filter: brightness(.87); }\n    to { filter: brightness(1.15); }\n  }\n  @keyframes nomad-arrival {\n    from { opacity: 0; transform: translateY(24px); }\n    to { opacity: .72; transform: translateY(0); }\n  }\n  @media (max-height: 480px) {\n    #status::before { top: 32%; }\n    #status::after { top: 52%; }\n    #status-progress { top: 69%; }\n    #nomad-loader-caption { top: calc(69% + 16px); }\n  }\n  @media (prefers-reduced-motion: reduce) {\n    #status::before, #nomad-loader-horizon { animation: none; }\n  }\n  /* Visible dès la première image, y compris avant le démarrage de Godot. */\n  @media (orientation: portrait) {\n    body::before {\n      content: \"↻\\A\\A NØMAD ZERO\\A\\A MODE PAYSAGE\\A\\A Tourne ton téléphone pour jouer.\\A Déverrouille la rotation si besoin.\";\n      position: fixed;\n      inset: 0;\n      z-index: 2147483647;\n      box-sizing: border-box;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      padding: max(24px, env(safe-area-inset-left));\n      color: #f7dcba;\n      background: radial-gradient(circle at 50% 43%, #183c46, #0b1620 75%);\n      font: 700 clamp(19px, 5vw, 28px)/1.3 system-ui, -apple-system, sans-serif;\n      text-align: center;\n      white-space: pre-line;\n      letter-spacing: .08em;\n    }\n  }\n</style>\n<script>\n  (function () {\n    function showLoaderProgress() {\n      const status = document.getElementById('status');\n      const progress = document.getElementById('status-progress');\n      if (!status || !progress) return;\n      const horizon = document.createElement('div');\n      horizon.id = 'nomad-loader-horizon';\n      status.appendChild(horizon);\n      const marker = document.createElement('div');\n      marker.id = 'nomad-loader-marker';\n      marker.textContent = 'V49.2 // COMBAT LISIBILITÉ';\n      status.appendChild(marker);\n      const caption = document.createElement('div');\n      caption.id = 'nomad-loader-caption';\n      const phase = document.createElement('span');\n      const percent = document.createElement('span');\n      phase.textContent = 'PRÉPARATION DU SECTEUR';\n      caption.append(phase, percent);\n      status.appendChild(caption);\n      const timer = window.setInterval(function () {\n        if (!status.isConnected) { window.clearInterval(timer); return; }\n        if (document.getElementById('status-notice')?.style.display === 'block') {\n          phase.textContent = 'CHARGEMENT INTERROMPU';\n          percent.textContent = '';\n          return;\n        }\n        if (progress.style.display === 'none') {\n          phase.textContent = 'INITIALISATION';\n          percent.textContent = '';\n          return;\n        }\n        const total = Number(progress.max);\n        const current = Number(progress.value);\n        if (total > 0 && Number.isFinite(current)) {\n          const value = Math.max(0, Math.min(100, Math.round(current / total * 100)));\n          percent.textContent = value + ' %';\n          phase.textContent = value >= 100 ? 'OUVERTURE DE LA ZONE' : 'CHARGEMENT DES DONNÉES';\n        } else {\n          phase.textContent = 'PRÉPARATION DU SECTEUR';\n          percent.textContent = '';\n        }\n      }, 120);\n    }\n    if (document.readyState === 'loading') {\n      document.addEventListener('DOMContentLoaded', showLoaderProgress, { once: true });\n    } else {\n      showLoaderProgress();\n    }\n  })();\n</script>\n<!-- NOMAD_LOADER_END -->"
